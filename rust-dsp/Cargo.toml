[package]
name = "zenith-dsp"
version = "1.0.0"
edition = "2021"
authors = ["ZenithTuner Engineering Team"]
description = "High-performance, panic-safe Robert Bristow-Johnson biquad acoustic correction core for boAt Nirvana Zenith"

[lib]
name = "zenith_dsp"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Minimal, robust, zero-dependency core for zero garbage collection and maximum execution speed.

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
